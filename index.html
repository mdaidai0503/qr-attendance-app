<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0f2747" />
<link rel="manifest" href="manifest.webmanifest" />
<title>QR出退勤 v2.2</title>
<style>
:root{--navy:#0f2747;--bg:#f4f6f8;--card:#fff;--muted:#687385;--line:#dce2e8;--green:#128a4b;--blue:#1f5ca8;--red:#b42318;--amber:#b54708}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:#182230}header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:14px 16px;font-weight:700;text-align:center}.wrap{max-width:820px;margin:auto;padding:16px 14px 92px}.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000012}.title{font-size:20px;font-weight:800;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.clock{font-size:42px;font-weight:800;text-align:center;letter-spacing:1px;margin:12px 0}.date{text-align:center;color:var(--muted)}input,select,button{font:inherit}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff;margin:6px 0 10px}button{border:0;border-radius:12px;padding:14px 16px;font-weight:800;cursor:pointer}.btn{width:100%;margin:7px 0}.primary{background:var(--navy);color:white}.in{background:var(--green);color:white;font-size:20px}.out{background:var(--blue);color:white;font-size:20px}.danger{background:#fee4e2;color:var(--red)}.secondary{background:#e9eef4;color:#183153}.warning{background:#fff4e5;color:var(--amber)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin:10px 0;background:#eef4ff}.ok{background:#ecfdf3;color:#067647}.err{background:#fef3f2;color:#b42318}.status{font-size:18px;font-weight:800;text-align:center;padding:10px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border-bottom:0}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef2f6;white-space:nowrap}.pill.on{background:#dcfae6;color:#067647}.pill.off{background:#eaf0f8;color:#344054}.pill.qr{background:#ecfdf3;color:#067647}.nav{position:fixed;left:0;right:0;bottom:0;background:var(--navy);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;background:transparent;color:white;border-radius:0;padding:12px 6px;font-size:12px}.nav b{display:block;font-size:20px;margin-bottom:2px}.adminbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small{font-size:12px}.right{text-align:right}.qrbox{display:flex;justify-content:center;padding:18px}.qrstatus{text-align:center;font-weight:800;margin:8px 0}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{flex:1;min-width:120px}.tableWrap{overflow:auto}.adminEdit{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.kpi{font-size:24px;font-weight:800}.mono{font-variant-numeric:tabular-nums}.notice{padding:12px;border-radius:10px;background:#fff8e7;color:#7a4b00;margin:10px 0}@media(max-width:560px){.grid3{grid-template-columns:1fr}.clock{font-size:38px}}
</style>
</head>
<body>
<header>QR出退勤 v2.2</header>
<div class="wrap">
<section id="employeeView">
  <div class="card">
    <div class="date" id="today"></div><div class="clock" id="clock">--:--</div>
        <div id="qrRequired" class="notice hidden"><b>QRコードを読み取ってください。</b><br><span class="small">通常のアプリ画面からは打刻できません。会社に掲示してある固定QRコードを読み取ると、1回だけ打刻できます。</span></div>
    <div id="employeeLogin">
      <div class="title">従業員打刻</div><div class="muted">固定QRコードを読み取った後、社員コードとPINを入力してください。</div>
      <input id="empCode" placeholder="社員コード 例：001" autocomplete="username" />
      <input id="empPin" placeholder="4桁以上のPIN" type="password" inputmode="numeric" maxlength="12" autocomplete="current-password" />
      <button class="btn primary" onclick="employeeLoginNow()">ログイン</button>
    </div>
    <div id="employeePanel" class="hidden">
      <div class="title" id="hello"></div><div class="status" id="empStatus"></div>
      <button class="btn in" id="btnIn" onclick="clockAction('in')">🟢 出勤する</button>
      <button class="btn out" id="btnOut" onclick="clockAction('out')">🔵 退勤する</button>
      <button class="btn secondary" onclick="employeeLogout()">ログアウト</button>
    </div>
    <div id="empMsg"></div>
  </div>
</section>

<section id="adminView" class="hidden">
  <div class="card">
    <div class="title">管理者</div>
    <div id="adminLogin">
      <input id="adminPin" placeholder="管理者PIN" type="password" inputmode="numeric" />
      <button class="btn primary" onclick="adminLoginNow()">管理者ログイン</button>
    </div>
    <div id="adminPanel" class="hidden">
      <div class="adminbar">
        <button class="secondary" onclick="loadToday()">今日の状況</button>
        <button class="secondary" onclick="showMonthPicker()">月間一覧</button>
        <button class="secondary" onclick="showEmployeeManager()">従業員管理</button>
        <button class="secondary" onclick="showQr()">QR表示</button>
        <button class="secondary" onclick="showEditLog()">修正履歴</button>
        <button class="secondary" onclick="showAdminSettings()">管理者設定</button>
      </div>
      <div id="adminContent"></div>
      <button class="btn danger" onclick="adminLogout()">管理者ログアウト</button>
    </div>
    <div id="adminMsg"></div>
  </div>
</section>

<section id="setupView" class="hidden">
  <div class="card"><div class="title">Supabase接続設定</div>
    <div class="muted">通常は入力不要です。会社の固定QRコードを読み取ると、Supabase接続情報がこの端末へ自動登録されます。管理者が手動で変更する場合だけ使用してください。</div>
    <input id="sbUrl" placeholder="https://xxxx.supabase.co" />
    <input id="sbKey" placeholder="anon public key" />
    <button class="btn primary" onclick="saveSetup()">保存</button>
    <button class="btn secondary" onclick="clearSetup()">接続設定を消去</button>
    <div id="setupMsg"></div>
  </div>
</section>
</div>
<nav class="nav">
  <button onclick="showView('employee')"><b>⏱</b>打刻</button>
  <button onclick="showView('admin')"><b>📋</b>管理</button>
  <button onclick="showView('setup')"><b>⚙️</b>設定</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let sb=null, employeeSession=null, adminSessionPin=null, monthCache=[];
const initialParams=new URLSearchParams(location.search);
let fixedQrToken=initialParams.get('qr')||'';
const qrSbUrl=initialParams.get('sburl')||'';
const qrSbKey=initialParams.get('sbkey')||'';
if(qrSbUrl&&qrSbKey){
  localStorage.setItem('sb_url',qrSbUrl);
  localStorage.setItem('sb_key',qrSbKey);
}
if(fixedQrToken||qrSbUrl||qrSbKey){
  const clean=location.pathname+(location.hash||'');
  history.replaceState(null,'',clean);
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setMsg(id,text,ok=true){$(id).innerHTML=text?`<div class="msg ${ok?'ok':'err'}">${esc(text)}</div>`:''}
function initSb(){const u=localStorage.getItem('sb_url'),k=localStorage.getItem('sb_key');if(u&&k&&window.supabase){sb=window.supabase.createClient(u,k);return true}return false}
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('today').textContent=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});}setInterval(tick,1000);tick();
function updateQrGate(){const ok=!!fixedQrToken;$('qrRequired').classList.toggle('hidden',ok);$('employeeLogin').classList.toggle('hidden',!ok||!!employeeSession);if(!ok&&employeeSession){$('employeePanel').classList.remove('hidden');$('btnIn').disabled=true;$('btnOut').disabled=true;$('btnIn').style.opacity=.45;$('btnOut').style.opacity=.45;setMsg('empMsg','打刻するには会社の固定QRコードをもう一度読み取ってください。',false)}}
updateQrGate();
function showView(v){['employee','admin','setup'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==v));if(v!=='admin')stopQrTimers();if(v==='setup'){$('sbUrl').value=localStorage.getItem('sb_url')||'';$('sbKey').value=localStorage.getItem('sb_key')||''}}
function requireSb(msgId){if(sb||initSb())return true;setMsg(msgId,'先に「設定」でSupabase接続情報を保存してください。',false);return false}
function saveSetup(){const u=$('sbUrl').value.trim(),k=$('sbKey').value.trim();if(!u||!k)return setMsg('setupMsg','URLとkeyを入力してください。',false);localStorage.setItem('sb_url',u);localStorage.setItem('sb_key',k);initSb();setMsg('setupMsg','保存しました。')}
function clearSetup(){localStorage.removeItem('sb_url');localStorage.removeItem('sb_key');sb=null;setMsg('setupMsg','接続設定を消去しました。')}
async function employeeLoginNow(){if(!fixedQrToken)return setMsg('empMsg','会社に掲示してある固定QRコードを読み取ってください。',false);if(!requireSb('empMsg'))return;const code=$('empCode').value.trim(),pin=$('empPin').value.trim();if(!code||!pin)return setMsg('empMsg','社員コードとPINを入力してください。',false);const {data,error}=await sb.rpc('qr_attendance_employee_status',{p_employee_code:code,p_pin:pin});if(error||!data?.ok)return setMsg('empMsg',data?.message||error?.message||'ログインできませんでした。',false);employeeSession={code,pin,name:data.name};$('employeeLogin').classList.add('hidden');$('employeePanel').classList.remove('hidden');$('hello').textContent=`${data.name} さん`;renderEmpStatus(data);setMsg('empMsg','')}
function renderEmpStatus(d){let text='本日は未出勤です';if(d.check_in&&!d.check_out)text=`出勤中　${fmtTime(d.check_in)}〜`;if(d.check_out)text=`退勤済　${fmtTime(d.check_in)} → ${fmtTime(d.check_out)}`;$('empStatus').textContent=text;$('btnIn').disabled=!!d.check_in;$('btnOut').disabled=!d.check_in||!!d.check_out;$('btnIn').style.opacity=$('btnIn').disabled?.45:1;$('btnOut').style.opacity=$('btnOut').disabled?.45:1}
async function clockAction(action){if(!employeeSession||!requireSb('empMsg'))return;if(!fixedQrToken)return setMsg('empMsg','打刻するには会社の固定QRコードを読み取ってください。',false);const token=fixedQrToken;const {data,error}=await sb.rpc('qr_attendance_employee_clock_qr',{p_employee_code:employeeSession.code,p_pin:employeeSession.pin,p_action:action,p_qr_token:token});if(error||!data?.ok)return setMsg('empMsg',data?.message||error?.message||'打刻できませんでした。',false);fixedQrToken='';setMsg('empMsg',data.message+' 次の打刻時は固定QRコードをもう一度読み取ってください。');const st=await sb.rpc('qr_attendance_employee_status',{p_employee_code:employeeSession.code,p_pin:employeeSession.pin});if(st.data?.ok)renderEmpStatus(st.data);updateQrGate()}
function employeeLogout(){employeeSession=null;$('employeePanel').classList.add('hidden');$('empPin').value='';setMsg('empMsg','');updateQrGate()}
async function adminLoginNow(){if(!requireSb('adminMsg'))return;const pin=$('adminPin').value.trim();const {data,error}=await sb.rpc('qr_attendance_admin_auth',{p_admin_pin:pin});if(error||!data)return setMsg('adminMsg','管理者PINが違います。',false);adminSessionPin=pin;$('adminLogin').classList.add('hidden');$('adminPanel').classList.remove('hidden');setMsg('adminMsg','');loadToday()}
function adminLogout(){stopQrTimers();adminSessionPin=null;$('adminLogin').classList.remove('hidden');$('adminPanel').classList.add('hidden');$('adminPin').value='';$('adminContent').innerHTML=''}
function fmtTime(v){return v?new Date(v).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'—'}
function isoDateLocal(d=new Date()){return d.toLocaleDateString('sv-SE')}
async function loadToday(){stopQrTimers();if(!adminSessionPin)return;const date=isoDateLocal();const {data,error}=await sb.rpc('qr_attendance_admin_day',{p_admin_pin:adminSessionPin,p_date:date});if(error)return setMsg('adminMsg',error.message,false);let h=`<h3>本日の出退勤</h3><div class="muted">各従業員の「修正」から時刻修正・取消ができます。</div>`;(data||[]).forEach(r=>{const st=!r.check_in?'未出勤':r.check_out?'退勤済':'出勤中';h+=`<div class="row"><div><b>${esc(r.employee_name)}</b><div class="small muted">${esc(r.employee_code)}</div></div><div class="right mono">${fmtTime(r.check_in)}${r.check_out?' → '+fmtTime(r.check_out):''}<br><span class="pill ${st==='出勤中'?'on':'off'}">${st}</span> <button style="padding:6px 10px" class="secondary" onclick='editToday(${JSON.stringify(r.employee_code)},${JSON.stringify(r.employee_name)},${JSON.stringify(r.check_in)},${JSON.stringify(r.check_out)})'>修正</button></div></div>`});$('adminContent').innerHTML=h}
function toTimeInput(v){if(!v)return'';const d=new Date(v);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function composeJstIso(date,time){if(!time)return null;return `${date}T${time}:00+09:00`}
function editToday(code,name,ci,co){const date=isoDateLocal();$('adminContent').innerHTML=`<h3>打刻修正</h3><div class="title">${esc(name)}</div><div class="muted">${esc(code)} / ${date}</div><label>出勤時刻</label><input id="editIn" type="time" value="${toTimeInput(ci)}"><label>退勤時刻</label><input id="editOut" type="time" value="${toTimeInput(co)}"><input id="editReason" placeholder="修正理由（任意）"><button class="btn primary" onclick="saveTodayEdit('${esc(code)}','${date}')">修正を保存</button><button class="btn danger" onclick="cancelTodayRecord('${esc(code)}','${date}')">この日の打刻を取消</button><button class="btn secondary" onclick="loadToday()">戻る</button>`}
async function saveTodayEdit(code,date){const ci=composeJstIso(date,$('editIn').value),co=composeJstIso(date,$('editOut').value),reason=$('editReason').value;const {data,error}=await sb.rpc('qr_attendance_admin_update_record',{p_admin_pin:adminSessionPin,p_employee_code:code,p_work_date:date,p_check_in:ci,p_check_out:co,p_reason:reason});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message||'修正できませんでした。',false);setMsg('adminMsg',data.message);loadToday()}
async function cancelTodayRecord(code,date){if(!confirm('この日の打刻を取消しますか？'))return;const reason=prompt('取消理由（任意）','')||'';const {data,error}=await sb.rpc('qr_attendance_admin_update_record',{p_admin_pin:adminSessionPin,p_employee_code:code,p_work_date:date,p_check_in:null,p_check_out:null,p_reason:reason});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message||'取消できませんでした。',false);setMsg('adminMsg',data.message);loadToday()}
function showMonthPicker(){stopQrTimers();const d=new Date();$('adminContent').innerHTML=`<h3>月間一覧</h3><div class="grid2"><select id="monthYear">${[d.getFullYear()-1,d.getFullYear(),d.getFullYear()+1].map(y=>`<option ${y===d.getFullYear()?'selected':''}>${y}</option>`).join('')}</select><select id="monthNo">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${(i+1)===(d.getMonth()+1)?'selected':''}>${i+1}月</option>`).join('')}</select></div><button class="btn primary" onclick="loadMonth()">表示</button><div id="monthRows"></div>`}
function minsBetween(a,b){if(!a||!b)return 0;return Math.max(0,Math.round((new Date(b)-new Date(a))/60000))}
function fmtMins(m){return `${Math.floor(m/60)}時間${String(m%60).padStart(2,'0')}分`}
async function loadMonth(){const y=+$('monthYear').value,m=+$('monthNo').value;const {data,error}=await sb.rpc('qr_attendance_admin_month',{p_admin_pin:adminSessionPin,p_year:y,p_month:m});if(error)return setMsg('adminMsg',error.message,false);monthCache=data||[];const totals={};monthCache.forEach(r=>{totals[r.employee_name]=(totals[r.employee_name]||0)+minsBetween(r.check_in,r.check_out)});let h=`<div class="tools"><button class="secondary" onclick="downloadMonthCsv()">CSV出力</button></div><h4>勤務時間集計</h4>`;Object.entries(totals).forEach(([n,v])=>h+=`<div class="row"><b>${esc(n)}</b><span class="kpi">${fmtMins(v)}</span></div>`);h+='<h4>打刻明細</h4>';monthCache.forEach(r=>h+=`<div class="row"><div>${esc(r.work_date)}<br><b>${esc(r.employee_name)}</b></div><div class="right mono">${fmtTime(r.check_in)} → ${fmtTime(r.check_out)}<br><span class="small muted">${fmtMins(minsBetween(r.check_in,r.check_out))}</span></div></div>`);$('monthRows').innerHTML=h||'<div class="muted">データがありません。</div>'}
function downloadMonthCsv(){if(!monthCache.length)return alert('出力するデータがありません。');const rows=[['日付','社員コード','氏名','出勤','退勤','勤務分']];monthCache.forEach(r=>rows.push([r.work_date,r.employee_code,r.employee_name,fmtTime(r.check_in),fmtTime(r.check_out),minsBetween(r.check_in,r.check_out)]));const csv='\ufeff'+rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`attendance-${$('monthYear').value}-${String($('monthNo').value).padStart(2,'0')}.csv`;a.click();URL.revokeObjectURL(a.href)}
async function showEmployeeManager(){stopQrTimers();const {data,error}=await sb.rpc('qr_attendance_admin_employees',{p_admin_pin:adminSessionPin});if(error)return setMsg('adminMsg',error.message,false);let h=`<h3>従業員管理</h3><input id="newCode" placeholder="社員コード"><input id="newName" placeholder="氏名"><input id="newPin" placeholder="初期PIN" type="password"><button class="btn primary" onclick="addEmployee()">従業員を追加</button><hr>`;(data||[]).forEach(r=>h+=`<div class="adminEdit"><div class="row"><div><b>${esc(r.name)}</b><div class="small muted">${esc(r.employee_code)}</div></div><span class="pill">${r.active?'有効':'停止'}</span></div><div class="tools"><button class="secondary" onclick="resetEmployeePin('${esc(r.employee_code)}')">PIN変更</button><button class="${r.active?'danger':'secondary'}" onclick="setEmployeeActive('${esc(r.employee_code)}',${!r.active})">${r.active?'停止':'再開'}</button></div></div>`);$('adminContent').innerHTML=h}
async function addEmployee(){const c=$('newCode').value.trim(),n=$('newName').value.trim(),p=$('newPin').value.trim();const {data,error}=await sb.rpc('qr_attendance_admin_add_employee',{p_admin_pin:adminSessionPin,p_employee_code:c,p_name:n,p_pin:p});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message||'追加できませんでした。',false);setMsg('adminMsg','従業員を追加しました。');showEmployeeManager()}
async function setEmployeeActive(code,active){if(!confirm(active?'この従業員を再開しますか？':'この従業員を停止しますか？'))return;const {data,error}=await sb.rpc('qr_attendance_admin_set_employee_active',{p_admin_pin:adminSessionPin,p_employee_code:code,p_active:active});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message,false);setMsg('adminMsg',data.message);showEmployeeManager()}
async function resetEmployeePin(code){const p=prompt('新しいPIN（4桁以上）');if(!p)return;const {data,error}=await sb.rpc('qr_attendance_admin_reset_employee_pin',{p_admin_pin:adminSessionPin,p_employee_code:code,p_new_pin:p});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message,false);setMsg('adminMsg',data.message)}
function stopQrTimers(){}
async function showQr(){if(!adminSessionPin)return;const base=location.href.split('?')[0].split('#')[0];const {data,error}=await sb.rpc('qr_attendance_admin_fixed_qr_token',{p_admin_pin:adminSessionPin});if(error||!data)return setMsg('adminMsg',error?.message||'固定QRを取得できませんでした。',false);const u=localStorage.getItem('sb_url')||'';const k=localStorage.getItem('sb_key')||'';if(!u||!k)return setMsg('adminMsg','この管理端末にSupabase接続情報がありません。先に設定画面で保存してください。',false);const params=new URLSearchParams({qr:String(data),sburl:u,sbkey:k,v:'22'});const qrUrl=base+'?'+params.toString();$('adminContent').innerHTML=`<h3>従業員用 固定QRコード</h3><div class="muted">このQRコードを会社入口などに掲示してください。QRコード自体は固定です。従業員は初回からSupabase設定不要で、QRを読み取るだけで打刻画面を利用できます。</div><div id="qr" class="qrbox"></div><div class="notice">QRには打刻用トークンとSupabaseの公開接続情報が含まれます。読み取り後、接続情報は端末へ自動保存され、URL欄からは自動的に消えます。1回のQR読取につき1回だけ打刻できます。</div>`;if(window.QRCode)new QRCode($('qr'),{text:qrUrl,width:300,height:300,correctLevel:QRCode.CorrectLevel.L})}
async function showEditLog(){stopQrTimers();const {data,error}=await sb.rpc('qr_attendance_admin_edit_log',{p_admin_pin:adminSessionPin,p_limit:100});if(error)return setMsg('adminMsg',error.message,false);let h='<h3>打刻修正履歴</h3>';(data||[]).forEach(r=>h+=`<div class="adminEdit"><b>${esc(r.employee_name)}</b> <span class="small muted">${esc(r.employee_code)} / ${esc(r.work_date)}</span><div class="small mono">変更前: ${fmtTime(r.old_check_in)} → ${fmtTime(r.old_check_out)}<br>変更後: ${fmtTime(r.new_check_in)} → ${fmtTime(r.new_check_out)}</div>${r.reason?`<div class="small">理由: ${esc(r.reason)}</div>`:''}<div class="small muted">${new Date(r.created_at).toLocaleString('ja-JP')}</div></div>`);$('adminContent').innerHTML=h+(data?.length?'':'<div class="muted">履歴はありません。</div>')}
function showAdminSettings(){stopQrTimers();$('adminContent').innerHTML=`<h3>管理者設定</h3><div class="muted">初期PIN 0000 のままの場合は、実運用前に必ず変更してください。</div><input id="newAdminPin" type="password" inputmode="numeric" placeholder="新しい管理者PIN（4桁以上）"><button class="btn primary" onclick="changeAdminPin()">管理者PINを変更</button>`}
async function changeAdminPin(){const p=$('newAdminPin').value.trim();if(p.length<4)return setMsg('adminMsg','新しいPINは4桁以上にしてください。',false);const {data,error}=await sb.rpc('qr_attendance_admin_change_pin',{p_admin_pin:adminSessionPin,p_new_pin:p});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message,false);adminSessionPin=p;$('adminPin').value=p;setMsg('adminMsg',data.message);showAdminSettings()}
initSb();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
