<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0f2747" />
<link rel="manifest" href="manifest.webmanifest" />
<title>QR出退勤 v2.3</title>
<style>
:root{--navy:#0f2747;--bg:#f4f6f8;--card:#fff;--muted:#687385;--line:#dce2e8;--green:#128a4b;--blue:#1f5ca8;--red:#b42318;--amber:#b54708}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:#182230}header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:14px 16px;font-weight:700;text-align:center}.wrap{max-width:820px;margin:auto;padding:16px 14px 92px}.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000012}.title{font-size:20px;font-weight:800;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.clock{font-size:42px;font-weight:800;text-align:center;letter-spacing:1px;margin:12px 0}.date{text-align:center;color:var(--muted)}input,select,button{font:inherit}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff;margin:6px 0 10px}button{border:0;border-radius:12px;padding:14px 16px;font-weight:800;cursor:pointer}.btn{width:100%;margin:7px 0}.primary{background:var(--navy);color:white}.danger{background:#fee4e2;color:var(--red)}.secondary{background:#e9eef4;color:#183153}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin:10px 0}.ok{background:#ecfdf3;color:#067647}.err{background:#fef3f2;color:#b42318}.notice{padding:12px;border-radius:10px;background:#fff8e7;color:#7a4b00;margin:10px 0}.successHero{padding:22px;border-radius:16px;background:#ecfdf3;text-align:center;margin:12px 0}.successHero .big{font-size:28px;font-weight:900}.status{font-size:18px;font-weight:800;text-align:center;padding:10px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border-bottom:0}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef2f6;white-space:nowrap}.pill.on{background:#dcfae6;color:#067647}.pill.off{background:#eaf0f8;color:#344054}.nav{position:fixed;left:0;right:0;bottom:0;background:var(--navy);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;background:transparent;color:white;border-radius:0;padding:12px 6px;font-size:12px}.nav b{display:block;font-size:20px;margin-bottom:2px}.adminbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small{font-size:12px}.right{text-align:right}.qrbox{display:flex;justify-content:center;padding:18px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{flex:1;min-width:120px}.adminEdit{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.kpi{font-size:24px;font-weight:800}.mono{font-variant-numeric:tabular-nums}.installSteps{line-height:1.8}.deviceBadge{text-align:center;font-size:14px;color:var(--muted);margin:8px 0}@media(max-width:560px){.clock{font-size:38px}}
</style>
</head>
<body>
<header>QR出退勤 v2.3</header>
<div class="wrap">
<section id="employeeView">
  <div class="card">
    <div class="date" id="today"></div><div class="clock" id="clock">--:--</div>
    <div id="employeeContent"><div class="muted" style="text-align:center">確認中…</div></div>
    <div id="empMsg"></div>
  </div>
</section>
<section id="adminView" class="hidden">
  <div class="card">
    <div class="title">管理者</div>
    <div id="adminLogin"><input id="adminPin" placeholder="管理者PIN" type="password" inputmode="numeric" /><button class="btn primary" onclick="adminLoginNow()">管理者ログイン</button></div>
    <div id="adminPanel" class="hidden">
      <div class="adminbar">
        <button class="secondary" onclick="loadToday()">今日の状況</button><button class="secondary" onclick="showMonthPicker()">月間一覧</button>
        <button class="secondary" onclick="showEmployeeManager()">従業員管理</button><button class="secondary" onclick="showQr()">打刻QR</button>
        <button class="secondary" onclick="showInstallQr()">インストール</button><button class="secondary" onclick="showEditLog()">修正履歴</button>
        <button class="secondary" onclick="showAdminSettings()">管理者設定</button>
      </div>
      <div id="adminContent"></div><button class="btn danger" onclick="adminLogout()">管理者ログアウト</button>
    </div><div id="adminMsg"></div>
  </div>
</section>
<section id="setupView" class="hidden"><div class="card"><div class="title">Supabase接続設定</div><div class="muted">通常、従業員は入力不要です。インストールQR・端末登録QR・打刻QRから自動設定されます。</div><input id="sbUrl" placeholder="https://xxxx.supabase.co" /><input id="sbKey" placeholder="anon public key" /><button class="btn primary" onclick="saveSetup()">保存</button><button class="btn secondary" onclick="clearSetup()">接続設定を消去</button><div id="setupMsg"></div></div></section>
</div>
<nav class="nav"><button onclick="showView('employee')"><b>⏱</b>打刻</button><button onclick="showView('admin')"><b>📋</b>管理</button><button onclick="showView('setup')"><b>⚙️</b>設定</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let sb=null,adminSessionPin=null,monthCache=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setMsg(id,text,ok=true){$(id).innerHTML=text?`<div class="msg ${ok?'ok':'err'}">${esc(text)}</div>`:''}
function initSb(){const u=localStorage.getItem('sb_url'),k=localStorage.getItem('sb_key');if(u&&k&&window.supabase){sb=window.supabase.createClient(u,k);return true}return false}
function requireSb(id){if(sb||initSb())return true;setMsg(id,'Supabase接続情報がありません。管理者のインストールQRまたは端末登録QRから開いてください。',false);return false}
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('today').textContent=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});}setInterval(tick,1000);tick();
function fmtTime(v){return v?new Date(v).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'—'}function isoDateLocal(d=new Date()){return d.toLocaleDateString('sv-SE')}
function getDeviceToken(){let t=localStorage.getItem('qr_device_token');if(!t){if(crypto.randomUUID)t=crypto.randomUUID()+crypto.randomUUID();else t=Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);localStorage.setItem('qr_device_token',t)}return t}
const params=new URLSearchParams(location.search);const enrollToken=params.get('enroll')||'';const attendanceQr=params.get('qrv23')||'';const qU=params.get('sburl')||'';const qK=params.get('sbkey')||'';const setupOnly=params.get('setup')==='1';
if(qU&&qK){localStorage.setItem('sb_url',qU);localStorage.setItem('sb_key',qK)}
function cleanUrl(){if(enrollToken||attendanceQr||qU||qK||setupOnly)history.replaceState(null,'',location.pathname+(location.hash||''))}
function showView(v){['employee','admin','setup'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==v));if(v==='setup'){$('sbUrl').value=localStorage.getItem('sb_url')||'';$('sbKey').value=localStorage.getItem('sb_key')||''}}
function saveSetup(){const u=$('sbUrl').value.trim(),k=$('sbKey').value.trim();if(!u||!k)return setMsg('setupMsg','URLとkeyを入力してください。',false);localStorage.setItem('sb_url',u);localStorage.setItem('sb_key',k);sb=null;initSb();setMsg('setupMsg','保存しました。');refreshEmployee()}
function clearSetup(){localStorage.removeItem('sb_url');localStorage.removeItem('sb_key');sb=null;setMsg('setupMsg','接続設定を消去しました。')}
async function bootEmployee(){initSb();if(enrollToken){await registerThisDevice(enrollToken);cleanUrl();return}if(attendanceQr){await automaticClock(attendanceQr);cleanUrl();return}if(setupOnly){cleanUrl();renderInstallHelp();return}await refreshEmployee()}
async function registerThisDevice(token){if(!requireSb('empMsg'))return renderUnregistered();const ua=(navigator.platform||'iPhone')+' / '+(navigator.userAgent||'').slice(0,80);const {data,error}=await sb.rpc('qr_attendance_v23_register_device',{p_enrollment_token:token,p_device_token:getDeviceToken(),p_device_name:ua});if(error||!data?.ok){renderUnregistered();return setMsg('empMsg',data?.message||error?.message||'端末登録できませんでした。',false)}$('employeeContent').innerHTML=`<div class="successHero"><div class="big">✅ 端末登録完了</div><div style="margin-top:8px"><b>${esc(data.name)}</b> さんの端末として登録しました。</div></div><div class="notice">今後は社員番号・PIN入力は不要です。出勤・退勤時に会社の固定QRをiPhoneカメラで読み取るだけです。</div>`;setMsg('empMsg','')}
async function automaticClock(qr){if(!requireSb('empMsg'))return renderUnregistered();$('employeeContent').innerHTML='<div class="status">打刻しています…</div>';const {data,error}=await sb.rpc('qr_attendance_v23_device_clock',{p_device_token:getDeviceToken(),p_qr_token:qr});if(error||!data?.ok){await refreshEmployee(false);return setMsg('empMsg',data?.message||error?.message||'打刻できませんでした。',false)}$('employeeContent').innerHTML=`<div class="successHero"><div class="big">${data.action==='in'?'🟢 出勤':'🔵 退勤'}</div><div style="font-size:22px;font-weight:800;margin-top:8px">${esc(data.name)} さん</div><div style="font-size:20px;margin-top:8px">${esc(data.message)}</div></div><div class="muted" style="text-align:center">この画面を閉じて大丈夫です。</div>`;setMsg('empMsg','')}
async function refreshEmployee(clear=true){if(clear)setMsg('empMsg','');if(!initSb())return renderNoSetup();const {data,error}=await sb.rpc('qr_attendance_v23_device_status',{p_device_token:getDeviceToken()});if(error)return renderNoSetup();if(!data?.registered)return renderUnregistered();renderRegistered(data)}
function renderNoSetup(){$('employeeContent').innerHTML=`<div class="title">初期設定が必要です</div><div class="notice">管理者に「インストールQR」またはあなた専用の「端末登録QR」を表示してもらい、このiPhoneのカメラで読み取ってください。</div>`}
function renderUnregistered(){$('employeeContent').innerHTML=`<div class="title">この端末は未登録です</div><div class="notice"><b>社員番号・PINの入力は不要です。</b><br>管理者にあなた専用の「端末登録QR」を表示してもらい、この携帯電話のカメラで1回だけ読み取ってください。</div><div class="small muted">端末登録後は、会社の固定QRを読むだけで出勤・退勤できます。</div>`}
function renderRegistered(d){let st='本日は未出勤です';if(d.check_in&&!d.check_out)st=`出勤中　${fmtTime(d.check_in)}〜`;if(d.check_out)st=`退勤済　${fmtTime(d.check_in)} → ${fmtTime(d.check_out)}`;$('employeeContent').innerHTML=`<div class="title" style="text-align:center">${esc(d.name)} さん</div><div class="deviceBadge">この端末は登録済みです</div><div class="status">${st}</div><div class="notice" style="text-align:center"><b>出勤・退勤は会社の固定QRを読み取るだけ</b><br><span class="small">社員番号・PIN・ボタン操作は不要です。</span></div>`}
function renderInstallHelp(){$('employeeContent').innerHTML=`<div class="title">アプリをホーム画面に追加</div><div class="installSteps">① このページをブラウザで開きます。<br>② 共有メニューから「ホーム画面に追加」を選びます。<br>③ 追加後、管理者にあなた専用の「端末登録QR」を表示してもらいます。<br>④ iPhoneカメラで端末登録QRを1回読み取れば完了です。</div><div class="notice">普段の出退勤は、会社の固定QRをカメラで読むだけです。</div>`}
async function adminLoginNow(){if(!requireSb('adminMsg'))return;const pin=$('adminPin').value.trim();const {data,error}=await sb.rpc('qr_attendance_admin_auth',{p_admin_pin:pin});if(error||!data)return setMsg('adminMsg','管理者PINが違います。',false);adminSessionPin=pin;$('adminLogin').classList.add('hidden');$('adminPanel').classList.remove('hidden');setMsg('adminMsg','');loadToday()}
function adminLogout(){adminSessionPin=null;$('adminLogin').classList.remove('hidden');$('adminPanel').classList.add('hidden');$('adminPin').value='';$('adminContent').innerHTML=''}
async function loadToday(){if(!adminSessionPin)return;const {data,error}=await sb.rpc('qr_attendance_admin_day',{p_admin_pin:adminSessionPin,p_date:isoDateLocal()});if(error)return setMsg('adminMsg',error.message,false);let h='<h3>本日の出退勤</h3>';(data||[]).forEach(r=>{const st=!r.check_in?'未出勤':r.check_out?'退勤済':'出勤中';h+=`<div class="row"><div><b>${esc(r.employee_name)}</b><div class="small muted">${esc(r.employee_code)}</div></div><div class="right mono">${fmtTime(r.check_in)}${r.check_out?' → '+fmtTime(r.check_out):''}<br><span class="pill ${st==='出勤中'?'on':'off'}">${st}</span> <button style="padding:6px 10px" class="secondary" onclick='editToday(${JSON.stringify(r.employee_code)},${JSON.stringify(r.employee_name)},${JSON.stringify(r.check_in)},${JSON.stringify(r.check_out)})'>修正</button></div></div>`});$('adminContent').innerHTML=h}
function toTimeInput(v){if(!v)return'';const d=new Date(v);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function composeJstIso(date,time){return time?`${date}T${time}:00+09:00`:null}
function editToday(code,name,ci,co){const date=isoDateLocal();$('adminContent').innerHTML=`<h3>打刻修正</h3><div class="title">${esc(name)}</div><div class="muted">${esc(code)} / ${date}</div><label>出勤時刻</label><input id="editIn" type="time" value="${toTimeInput(ci)}"><label>退勤時刻</label><input id="editOut" type="time" value="${toTimeInput(co)}"><input id="editReason" placeholder="修正理由（任意）"><button class="btn primary" onclick="saveTodayEdit('${esc(code)}','${date}')">修正を保存</button><button class="btn danger" onclick="cancelTodayRecord('${esc(code)}','${date}')">この日の打刻を取消</button><button class="btn secondary" onclick="loadToday()">戻る</button>`}
async function saveTodayEdit(code,date){const {data,error}=await sb.rpc('qr_attendance_admin_update_record',{p_admin_pin:adminSessionPin,p_employee_code:code,p_work_date:date,p_check_in:composeJstIso(date,$('editIn').value),p_check_out:composeJstIso(date,$('editOut').value),p_reason:$('editReason').value});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message||'修正できませんでした。',false);setMsg('adminMsg',data.message);loadToday()}
async function cancelTodayRecord(code,date){if(!confirm('この日の打刻を取消しますか？'))return;const {data,error}=await sb.rpc('qr_attendance_admin_update_record',{p_admin_pin:adminSessionPin,p_employee_code:code,p_work_date:date,p_check_in:null,p_check_out:null,p_reason:prompt('取消理由（任意）','')||''});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message||'取消できませんでした。',false);setMsg('adminMsg',data.message);loadToday()}
function showMonthPicker(){const d=new Date();$('adminContent').innerHTML=`<h3>月間一覧</h3><div class="grid2"><select id="monthYear">${[d.getFullYear()-1,d.getFullYear(),d.getFullYear()+1].map(y=>`<option ${y===d.getFullYear()?'selected':''}>${y}</option>`).join('')}</select><select id="monthNo">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${(i+1)===(d.getMonth()+1)?'selected':''}>${i+1}月</option>`).join('')}</select></div><button class="btn primary" onclick="loadMonth()">表示</button><div id="monthRows"></div>`}
function minsBetween(a,b){if(!a||!b)return 0;return Math.max(0,Math.round((new Date(b)-new Date(a))/60000))}function fmtMins(m){return `${Math.floor(m/60)}時間${String(m%60).padStart(2,'0')}分`}
async function loadMonth(){const y=+$('monthYear').value,m=+$('monthNo').value;const {data,error}=await sb.rpc('qr_attendance_admin_month',{p_admin_pin:adminSessionPin,p_year:y,p_month:m});if(error)return setMsg('adminMsg',error.message,false);monthCache=data||[];const totals={};monthCache.forEach(r=>totals[r.employee_name]=(totals[r.employee_name]||0)+minsBetween(r.check_in,r.check_out));let h=`<div class="tools"><button class="secondary" onclick="downloadMonthCsv()">CSV出力</button></div><h4>勤務時間集計</h4>`;Object.entries(totals).forEach(([n,v])=>h+=`<div class="row"><b>${esc(n)}</b><span class="kpi">${fmtMins(v)}</span></div>`);h+='<h4>打刻明細</h4>';monthCache.forEach(r=>h+=`<div class="row"><div>${esc(r.work_date)}<br><b>${esc(r.employee_name)}</b></div><div class="right mono">${fmtTime(r.check_in)} → ${fmtTime(r.check_out)}<br><span class="small muted">${fmtMins(minsBetween(r.check_in,r.check_out))}</span></div></div>`);$('monthRows').innerHTML=h||'<div class="muted">データがありません。</div>'}
function downloadMonthCsv(){if(!monthCache.length)return alert('出力するデータがありません。');const rows=[['日付','社員コード','氏名','出勤','退勤','勤務分']];monthCache.forEach(r=>rows.push([r.work_date,r.employee_code,r.employee_name,fmtTime(r.check_in),fmtTime(r.check_out),minsBetween(r.check_in,r.check_out)]));const csv='\\ufeff'+rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\\r\\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`attendance-${$('monthYear').value}-${String($('monthNo').value).padStart(2,'0')}.csv`;a.click();URL.revokeObjectURL(a.href)}
async function showEmployeeManager(){const {data,error}=await sb.rpc('qr_attendance_admin_employees',{p_admin_pin:adminSessionPin});if(error)return setMsg('adminMsg',error.message,false);let h=`<h3>従業員管理</h3><div class="muted">従業員本人は社員番号・PINを入力しません。新規登録時のPINはシステム内部用として自動生成します。</div><input id="newCode" placeholder="社員コード"><input id="newName" placeholder="氏名"><button class="btn primary" onclick="addEmployee()">従業員を追加</button><hr>`;(data||[]).forEach(r=>h+=`<div class="adminEdit"><div class="row"><div><b>${esc(r.name)}</b><div class="small muted">${esc(r.employee_code)}</div></div><span class="pill">${r.active?'有効':'停止'}</span></div><div class="tools"><button class="primary" onclick="showEnrollQr('${esc(r.employee_code)}','${esc(r.name)}')">端末登録QR</button><button class="secondary" onclick="showDevices('${esc(r.employee_code)}','${esc(r.name)}')">登録端末</button><button class="${r.active?'danger':'secondary'}" onclick="setEmployeeActive('${esc(r.employee_code)}',${!r.active})">${r.active?'停止':'再開'}</button></div></div>`);$('adminContent').innerHTML=h}
function randomInternalPin(){const a=new Uint32Array(2);crypto.getRandomValues(a);return String(a[0])+String(a[1])}
async function addEmployee(){const c=$('newCode').value.trim(),n=$('newName').value.trim();if(!c||!n)return setMsg('adminMsg','社員コードと氏名を入力してください。',false);const {data,error}=await sb.rpc('qr_attendance_admin_add_employee',{p_admin_pin:adminSessionPin,p_employee_code:c,p_name:n,p_pin:randomInternalPin()});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message||'追加できませんでした。',false);setMsg('adminMsg','従業員を追加しました。');showEmployeeManager()}
async function setEmployeeActive(code,active){if(!confirm(active?'この従業員を再開しますか？':'この従業員を停止しますか？'))return;const {data,error}=await sb.rpc('qr_attendance_admin_set_employee_active',{p_admin_pin:adminSessionPin,p_employee_code:code,p_active:active});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message,false);setMsg('adminMsg',data.message);showEmployeeManager()}
function baseUrl(){return location.href.split('?')[0].split('#')[0]}function qrConnection(){return{u:localStorage.getItem('sb_url')||'',k:localStorage.getItem('sb_key')||''}}
async function showEnrollQr(code,name){const {data,error}=await sb.rpc('qr_attendance_v23_admin_create_enrollment',{p_admin_pin:adminSessionPin,p_employee_code:code});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message||'端末登録QRを作れませんでした。',false);const {u,k}=qrConnection();if(!u||!k)return setMsg('adminMsg','管理端末のSupabase接続設定が必要です。',false);const url=baseUrl()+'?'+new URLSearchParams({enroll:data.token,sburl:u,sbkey:k,v:'23'});$('adminContent').innerHTML=`<h3>${esc(name)} さんの端末登録QR</h3><div class="notice"><b>本人の携帯電話で、このQRを1回だけ読み取ってください。</b><br>有効時間は15分、1回使用すると無効になります。</div><div id="qrEnroll" class="qrbox"></div><button class="btn secondary" onclick="showEmployeeManager()">戻る</button>`;new QRCode($('qrEnroll'),{text:url,width:300,height:300,correctLevel:QRCode.CorrectLevel.L})}
async function showDevices(code,name){const {data,error}=await sb.rpc('qr_attendance_v23_admin_devices',{p_admin_pin:adminSessionPin,p_employee_code:code});if(error)return setMsg('adminMsg',error.message,false);let h=`<h3>${esc(name)} さんの登録端末</h3>`;(data||[]).forEach(d=>h+=`<div class="adminEdit"><div><b>${esc(d.device_name||'iPhone / ブラウザ')}</b></div><div class="small muted">登録: ${new Date(d.registered_at).toLocaleString('ja-JP')}<br>最終確認: ${d.last_seen_at?new Date(d.last_seen_at).toLocaleString('ja-JP'):'—'}</div><div class="tools"><span class="pill">${d.active?'有効':'解除済'}</span>${d.active?`<button class="danger" onclick="revokeDevice('${d.device_id}','${esc(code)}','${esc(name)}')">端末解除</button>`:''}</div></div>`);h+=`<button class="btn primary" onclick="showEnrollQr('${esc(code)}','${esc(name)}')">新しい端末を登録</button><button class="btn secondary" onclick="showEmployeeManager()">戻る</button>`;$('adminContent').innerHTML=h}
async function revokeDevice(id,code,name){if(!confirm('この端末の打刻権限を解除しますか？'))return;const {data,error}=await sb.rpc('qr_attendance_v23_admin_revoke_device',{p_admin_pin:adminSessionPin,p_device_id:id});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message,false);setMsg('adminMsg',data.message);showDevices(code,name)}
async function showQr(){const {data,error}=await sb.rpc('qr_attendance_v23_admin_fixed_qr_token',{p_admin_pin:adminSessionPin});if(error||!data)return setMsg('adminMsg',error?.message||'固定QRを取得できませんでした。',false);const {u,k}=qrConnection();if(!u||!k)return setMsg('adminMsg','管理端末のSupabase接続設定が必要です。',false);const url=baseUrl()+'?'+new URLSearchParams({qrv23:String(data),sburl:u,sbkey:k,v:'23'});$('adminContent').innerHTML=`<h3>会社掲示用 固定打刻QR</h3><div class="notice"><b>このQRを会社入口に掲示してください。</b><br>登録済み端末で読み取るだけで、自動的に出勤または退勤を記録します。</div><div id="qrAttendance" class="qrbox"></div><div class="small muted">社員番号・PIN・打刻ボタンは不要です。</div><button class="btn danger" onclick="regenerateQr()">固定QRを作り直す</button>`;new QRCode($('qrAttendance'),{text:url,width:300,height:300,correctLevel:QRCode.CorrectLevel.L})}
async function regenerateQr(){if(!confirm('現在掲示中の固定QRは使えなくなります。作り直しますか？'))return;const {data,error}=await sb.rpc('qr_attendance_v23_admin_regenerate_fixed_qr',{p_admin_pin:adminSessionPin});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message,false);setMsg('adminMsg','固定QRを更新しました。新しいQRを掲示してください。');showQr()}
function showInstallQr(){const {u,k}=qrConnection();if(!u||!k)return setMsg('adminMsg','管理端末のSupabase接続設定が必要です。',false);const url=baseUrl()+'?'+new URLSearchParams({setup:'1',sburl:u,sbkey:k,v:'23'});$('adminContent').innerHTML=`<h3>従業員用 インストールQR</h3><div class="notice">誰でもこのQRからアプリを開けます。ただし、管理者が端末登録しない限り打刻はできません。</div><div id="qrInstall" class="qrbox"></div><div class="small muted">iPhoneでは開いたページを「ホーム画面に追加」してください。</div>`;new QRCode($('qrInstall'),{text:url,width:300,height:300,correctLevel:QRCode.CorrectLevel.L})}
async function showEditLog(){const {data,error}=await sb.rpc('qr_attendance_admin_edit_log',{p_admin_pin:adminSessionPin,p_limit:100});if(error)return setMsg('adminMsg',error.message,false);let h='<h3>打刻修正履歴</h3>';(data||[]).forEach(r=>h+=`<div class="adminEdit"><b>${esc(r.employee_name)}</b> <span class="small muted">${esc(r.employee_code)} / ${esc(r.work_date)}</span><div class="small mono">変更前: ${fmtTime(r.old_check_in)} → ${fmtTime(r.old_check_out)}<br>変更後: ${fmtTime(r.new_check_in)} → ${fmtTime(r.new_check_out)}</div>${r.reason?`<div class="small">理由: ${esc(r.reason)}</div>`:''}<div class="small muted">${new Date(r.created_at).toLocaleString('ja-JP')}</div></div>`);$('adminContent').innerHTML=h+(data?.length?'':'<div class="muted">履歴はありません。</div>')}
function showAdminSettings(){$('adminContent').innerHTML=`<h3>管理者設定</h3><input id="newAdminPin" type="password" inputmode="numeric" placeholder="新しい管理者PIN（4桁以上）"><button class="btn primary" onclick="changeAdminPin()">管理者PINを変更</button>`}
async function changeAdminPin(){const p=$('newAdminPin').value.trim();if(p.length<4)return setMsg('adminMsg','新しいPINは4桁以上にしてください。',false);const {data,error}=await sb.rpc('qr_attendance_admin_change_pin',{p_admin_pin:adminSessionPin,p_new_pin:p});if(error||!data?.ok)return setMsg('adminMsg',data?.message||error?.message,false);adminSessionPin=p;$('adminPin').value=p;setMsg('adminMsg',data.message);showAdminSettings()}
initSb();bootEmployee();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
